<!DOCTYPE html>   
<head>    
<title>Ivan Fokin</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_fok(a, b) { 
return a + b; 
}
function odejmowanie_fok(a, b) { 
return a - b; 
} 
function mnozenie_fok(a, b) { 
return a * b; 
}
function kwadrat_fok1(a, b) { 
return a * a;
}
function kwadrat_fok2(a, b) { 
return b * b;
}
function reszta_fok(a, b) { 
return a % b;
}
document.write("suma_fok("+a+","+b+")="+suma_fok(a,b)+"<br>");
document.write("odejmowanie_fok("+a+","+b+")="+odejmowanie_fok(a,b)+"<br>");
document.write("mnożenie_fok("+a+","+b+")="+mnozenie_fok(a,b)+"<br>");
document.write("od_kwadratu_fok("+a+","+b+")<br>"+a+"^2 = "+kwadrat_fok1(a,b)+"<br>"+b+"^2 = "+kwadrat_fok2(a,b)+"<br>");
document.write("reszta_z_dzielenia_a_przez_b_fok("+a+","+b+")="+reszta_fok(a,b)+"<br>");
</script> 
</div> 
</body> 
</html>
